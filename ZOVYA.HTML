<!DOCTYPE html>
<html>
<head>
    <title>ZOVYA_Gifts</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        /* Heading */
        header {
            text-align: center;
            padding: 10px;
            background: #fff0f6;
        }

        header h1 {
            color: #8e2875;
            font-size: 35px;
            margin: 10px;
        }

        header p {
            color: #666;
            font-size: 16px;
        }

        /* Navigation Buttons */
        nav {
            text-align: center;
            padding: 18px 10px;
            background: white;
        }

        nav a {
            text-decoration: none;
        }

        nav button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 15px;
            color: #8e2875;
            background: #fff0f6;
            border: 1px solid #8e2875;
            border-radius: 6px;
            cursor: pointer;
        }

        nav button:hover {
            background: #8e2875;
            color: white;
        }

        /* Gift Image */
        .gift-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 25px 15px;
            background: #fff0f6;
        }

        .welcome h2 {
            color: #8e2875;
            font-size: 27px;
        }

        .welcome p {
            color: #555;
            font-size: 16px;
            line-height: 1.7;
        }

        /* Footer */
        footer {
            background: #8e2875;
            color: white;
            text-align: center;
            padding: 12px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 27px;
            }

            nav button {
                padding: 9px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Website Heading -->
    <header>
        <h1>Welcome to ZOVYA_Gifts 🎁</h1>
        <p>Make Every Occasion Special ❤️</p>
    </header>

    <main>

        <!-- Navigation Menu -->
        <nav>
            <a href="ZOVYA.HTML"><button>🏠 Home</button></a>

            <a href="Product.HTML"><button>Product Show</button></a>

            <a href="Login.HTML"><button>Login</button></a>

            <a href="Sign_Up.HTML"><button>Sign_Up</button></a>

            <a href="Account.HTML"><button>👤 Account</button></a>
        </nav>

        <!-- Existing Background Photo: Unchanged -->
        <section class="gift-image">
            <img src="images/wallpaper.jpg" alt="ZOVYA Gifts">
        </section>

        <!-- New Welcome Section -->
        <section class="welcome">
            <h2>Find the Perfect Gift 🎁</h2>

            <p>
                Welcome to ZOVYA_Gifts!<br>
                Find beautiful gifts for your loved ones
                and make every occasion special.
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p> ZOVYA_Gifts | Gifts Made With Love ❤️ </p>
    </footer>

</body>
</html>
