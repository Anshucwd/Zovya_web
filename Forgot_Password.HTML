<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ZOVYA_Gifts</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #333;
            background: linear-gradient(135deg, #fff0f6, #fce0ee);
        }
        .reset-card {
            width: min(460px, 100%);
            padding: 38px 34px;
            background: #fff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(142, 40, 117, .16);
        }
        .reset-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #8e2875;
            background: #fff0f6;
            font-size: 31px;
        }
        h1 { margin: 8px 0; color: #8e2875; font-size: 28px; }
        .intro { margin: 0 0 25px; color: #666; line-height: 1.6; }
        .field { margin: 18px 0; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8c8d3;
            border-radius: 8px;
            background: #fff;
            font-size: 15px;
        }
        input:focus, select:focus { outline: 2px solid #d58ac6; border-color: #8e2875; }
        .help { margin: 7px 0 0; color: #888; font-size: 12px; line-height: 1.5; }
        .submit {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #9f2089;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .submit:hover { background: #7b176a; }
        .back { display: inline-block; margin-top: 22px; color: #8e2875; font-weight: 700; text-decoration: none; }
        @media (max-width: 480px) { .reset-card { padding: 30px 22px; } }
    </style>
</head>
<body>
    <main class="reset-card">
        <div class="reset-icon">🔐</div>
        <h1>Forgot Password?</h1>
        <p class="intro">Enter your ZOVYA User ID, registered phone number, or email. We will send a one-time code to your saved contact.</p>

        <form action="http://localhost:8000/api/password/forgot" method="post">
            <div class="field">
                <label for="identifier">User ID, phone number, or email</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    placeholder="Enter your registered details"
                    autocomplete="username"
                    required
                >
                <p class="help">If you forgot your User ID, enter the phone or email you used when creating your account.</p>
            </div>

            <div class="field">
                <label for="channel">Send OTP to</label>
                <select id="channel" name="channel" required>
                    <option value="email">Registered email</option>
                    <option value="sms">Registered mobile number</option>
                </select>
            </div>

            <button class="submit" type="submit">Send OTP</button>
        </form>

        <a class="back" href="Login.HTML">Back to Login</a>
    </main>
</body>
</html>
