<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZOVYA - My Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #333;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: normal;
        }

        .header-icons a {
            color: #333;
            text-decoration: none;
            font-size: 25px;
            margin-left: 15px;
        }

        /* Profile */
        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 22px;
            border-bottom: 1px solid #eee;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-image {
            position: relative;
            flex: 0 0 65px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: #f8e5f3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        .profile-camera {
            position: absolute;
            right: -3px;
            bottom: -3px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            border-radius: 50%;
            background: #9f2089;
        }

        .profile-camera svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .profile h3 {
            margin: 0 0 7px;
            font-size: 18px;
        }

        .profile p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        .profile-arrow {
            font-size: 28px;
            color: #555;
            text-decoration: none;
        }

        /* Help Centre and Refer & Earn */
        .quick-options {
            display: flex;
            gap: 12px;
            padding: 20px 22px;
        }

        .quick-card {
            flex: 1;
            padding: 20px 5px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 14px;
            color: #333;
            text-decoration: none;
        }

        .quick-card span {
            display: block;
            font-size: 28px;
            margin-bottom: 12px;
        }

        /* Account Sections */
        .section {
            padding: 10px 22px;
        }

        .section h3 {
            font-size: 17px;
            margin: 20px 0 10px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
            color: #444;
            text-decoration: none;
            font-size: 16px;
        }

        .option-icon {
            width: 40px;
            font-size: 22px;
            text-align: center;
        }

        .option:hover,
        .quick-card:hover {
            background-color: #faf5fa;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            background-color: white;
            border-top: 1px solid #ddd;
            padding: 10px 0;
        }

        .bottom-nav a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #666;
            font-size: 12px;
        }

        .bottom-nav span {
            display: block;
            font-size: 23px;
            margin-bottom: 5px;
        }

        .bottom-nav .active {
            color: #9f2089;
            font-weight: bold;
        }

        /* Mobile and Desktop */
        @media (min-width: 700px) {
            body {
                max-width: 500px;
                margin: auto;
                border-left: 1px solid #eee;
                border-right: 1px solid #eee;
            }

            .bottom-nav {
                left: 50%;
                transform: translateX(-50%);
                max-width: 500px;
            }
        }
    
        .profile-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-camera {
            z-index: 1;
            padding: 0;
            cursor: pointer;
        }

        .profile-camera:focus-visible {
            outline: 3px solid #e7abd9;
            outline-offset: 2px;
        }
    
        .profile-photo {
            cursor: zoom-in;
        }

        .photo-viewer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            background: rgba(25, 12, 24, 0.82);
        }

        .photo-viewer[hidden] {
            display: none;
        }

        .photo-viewer-image {
            width: min(72vw, 320px);
            height: min(72vw, 320px);
            max-height: 70vh;
            border: 4px solid white;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .close-photo-preview {
            width: 48px;
            height: 48px;
            border: 2px solid white;
            border-radius: 50%;
            background: #9f2089;
            color: white;
            font-size: 30px;
            line-height: 1;
            cursor: pointer;
        }

        .close-photo-preview:hover {
            background: #6f1e5c;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <h2>ACCOUNT</h2>

        <div class="header-icons">
            <a href="Product.HTML" aria-label="Search">⌕</a>
            <a href="Product.HTML" aria-label="Shopping Cart">🛒</a>
        </div>

    </header>

    <!-- Profile Section -->
    <div class="profile">

        <div class="profile-left">

            <div class="profile-image" id="profileImage" aria-label="Profile photo">
                <span id="profilePlaceholder" aria-hidden="true">👤</span>
                <img class="profile-photo" id="profilePhoto" alt="Your profile photo" hidden>
                <button class="profile-camera" id="profilePhotoButton" type="button" aria-label="Choose a profile photo" title="Choose a profile photo">
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                        <path d="M8.2 5 9.5 3.5h5L15.8 5H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.2Z" />
                        <circle cx="12" cy="12" r="3.2" />
                    </svg>
                </button>
            </div>
            <input id="profilePhotoInput" type="file" accept="image/*" hidden>
            <div>
                <h3 id="accountUserName">Welcome to ZOVYA</h3>
                <p id="accountUserInfo">Manage your account</p>
            </div>

        </div>

        <a href="Login.HTML" class="profile-arrow">›</a>

    </div>

    <!-- Quick Options -->
    <div class="quick-options">

        <a href="Login.HTML" class="quick-card">
            <span>📞</span>
            Help Centre
        </a>

        <a href="Sign_In.HTML" class="quick-card">
            <span>🎁</span>
            Refer & Earn
        </a>

    </div>

    <!-- My Payments -->
    <section class="section">

        <h3>My Payments</h3>

        <a href="Login.HTML" class="option">
            <span class="option-icon">💳</span>
            Bank & UPI Details
        </a>

        <a href="Login.HTML" class="option">
            <span class="option-icon">💰</span>
            Payment & Refund
        </a>

    </section>

    <!-- My Activity -->
    <section class="section">

        <h3>My Activity</h3>

        <a href="Product.HTML" class="option">
            <span class="option-icon">❤️</span>
            Wishlisted Products
        </a>

        <a href="Product.HTML" class="option">
            <span class="option-icon">🔗</span>
            Shared Products
        </a>

        <a href="Product.HTML" class="option">
            <span class="option-icon">🏬</span>
            Followed Shops
        </a>

    </section>

    <!-- Others -->
    <section class="section">

        <h3>Others</h3>

        <a href="Login.HTML" class="option">
            <span class="option-icon">👤</span>
            Login / Sign Up
        </a>

        <a href="ZOVYA.HTML" class="option">
            <span class="option-icon">🏠</span>
            Back to Home
        </a>

    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="ZOVYA.HTML">
            <span>⌂</span>
            Home
        </a>

        <a href="Product.HTML">
            <span>▦</span>
            Categories
        </a>

        <a href="Product.HTML">
            <span>📦</span>
            My Orders
        </a>

        <a href="Account.HTML" class="active">
            <span>👤</span>
            Account
        </a>

    </nav>


    <div class="photo-viewer" id="photoViewer" role="dialog" aria-modal="true" aria-label="Profile photo preview" hidden>
        <img class="photo-viewer-image" id="photoViewerImage" alt="Larger profile photo">
        <button class="close-photo-preview" id="closePhotoPreview" type="button" aria-label="Return photo to profile circle" title="Back to profile">×</button>
    </div>
    <script>
        (() => {
            const legacyStorageKey = 'zovya.profilePhoto.v1';
            const photoKeyPrefix = 'zovya.profilePhoto.user.';
            let currentStorageKey = '';
            const fileInput = document.getElementById('profilePhotoInput');
            const chooseButton = document.getElementById('profilePhotoButton');
            const photo = document.getElementById('profilePhoto');
            const placeholder = document.getElementById('profilePlaceholder');
            const viewer = document.getElementById('photoViewer');
            const viewerImage = document.getElementById('photoViewerImage');
            const closeButton = document.getElementById('closePhotoPreview');

            function showPhoto(dataUrl) {
                if (!dataUrl || !/^data:image\/(jpeg|png|webp);base64,/i.test(dataUrl)) {
                    photo.removeAttribute('src');
                    photo.hidden = true;
                    placeholder.hidden = false;
                    return;
                }
                photo.src = dataUrl;
                photo.hidden = false;
                placeholder.hidden = true;
            }

            showPhoto(null);
            async function loadAccountDetails() {
                try {
                    const response = await fetch('/api/me', { cache: 'no-store' });
                    if (!response.ok) return;
                    const result = await response.json();
                    if (result.authenticated && result.user) {
                        const userId = String(result.user.id);
                        currentStorageKey = photoKeyPrefix + userId;
                        const oldPhoto = localStorage.getItem(legacyStorageKey);
                        if (oldPhoto) {
                            if (!localStorage.getItem(currentStorageKey)) {
                                localStorage.setItem(currentStorageKey, oldPhoto);
                            }
                            localStorage.removeItem(legacyStorageKey);
                        }
                        showPhoto(localStorage.getItem(currentStorageKey));
                        document.getElementById('accountUserName').textContent = result.user.name;
                        document.getElementById('accountUserInfo').textContent = 'User ID: ' + userId;
                    }
                } catch (error) {
                    // Keep the guest view when the page is opened outside the local web server.
                }
            }

            loadAccountDetails();

            photo.addEventListener('click', () => {
                if (photo.hidden) return;
                viewerImage.src = photo.src;
                viewer.hidden = false;
            });

            viewer.addEventListener('click', event => {
                if (event.target === viewer) viewer.hidden = true;
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') viewer.hidden = true;
            });

            closeButton.addEventListener('click', () => {
                viewer.hidden = true;
            });

            chooseButton.addEventListener('click', () => {
                if (!currentStorageKey) {
                    alert('Please log in first so this photo can be saved to your account.');
                    window.location.href = '/Login.HTML';
                    return;
                }
                fileInput.click();
            });
            fileInput.addEventListener('change', async () => {
                const file = fileInput.files && fileInput.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file.');
                    fileInput.value = '';
                    return;
                }

                try {
                    const imageUrl = URL.createObjectURL(file);
                    const image = await new Promise((resolve, reject) => {
                        const loadedImage = new Image();
                        loadedImage.onload = () => resolve(loadedImage);
                        loadedImage.onerror = () => reject(new Error('This image could not be opened.'));
                        loadedImage.src = imageUrl;
                    });
                    URL.revokeObjectURL(imageUrl);

                    const maxSize = 600;
                    const scale = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
                    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);

                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
                    if (!blob) throw new Error('The image could not be prepared.');
                    const dataUrl = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(new Error('The image could not be saved.'));
                        reader.readAsDataURL(blob);
                    });

                    localStorage.setItem(currentStorageKey, dataUrl);
                    showPhoto(dataUrl);
                } catch (error) {
                    alert('Could not save this photo. Try another image or a smaller file.');
                } finally {
                    fileInput.value = '';
                }
            });
        })();
    </script>
</body>

</html>
